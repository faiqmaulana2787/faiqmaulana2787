<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Pacman - Faiq's Game</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div class="container">
      <header>
        <h1>Pacman — Playable Demo</h1>
        <p>Use arrow keys (↑ ↓ ← →) or WASD to move. Eat all dots to win.</p>
      </header>

      <canvas id="game" width="480" height="480"></canvas>

      <div class="hud">
        <span id="score">Score: 0</span>
        <button id="restart">Restart</button>
      </div>

      <footer>
        <p>Made by <strong>Faiq Maulana</strong> — Fullstack Developer</p>
      </footer>
    </div>

    <script src="script.js"></script>
  </body>
</html>
